# Voice home-automation stack: Home Assistant + MQTT broker + local speech-to-text and text-to-speech.
# The LLM runs in Ollama on the host (host.docker.internal:11434). All ports bind to 127.0.0.1 only, except Home
# Assistant when HA_BIND=0.0.0.0 (phone app on the home network; it has its own login).
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ha_config:/config
    ports:
      - "${HA_BIND:-127.0.0.1}:${HA_PORT:-8123}:8123"  # HA_BIND=0.0.0.0: the phone app reaches it on the home network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mosquitto, whisper, piper, wakeword]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"

  whisper:
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-small-int8} --language ${VOICE_LANGUAGE:-es}
    volumes:
      - whisper_data:/data

  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-es_ES-davefx-medium}
    volumes:
      - piper_data:/data

  # Hears the wake word ("okay nabu") in the audio the browser sends; the same detector as the real ESP32.
  # Own trained words (.json + .tflite) live in the user's data folder, not in the repo.
  wakeword:
    image: rhasspy/wyoming-microwakeword:latest
    restart: unless-stopped
    command: --uri tcp://0.0.0.0:10400 --custom-model-dir /custom
    volumes:
      - type: bind  # created first by setup/ensure_host_paths.py; Docker would make it root-owned
        source: ${WAKE_WORDS_DIR:-../../../project_studio_data/wake_words}
        target: /custom
        read_only: true
        bind: { create_host_path: false }

  # ESPHome dashboard: wireless (OTA) updates and logs of the real ESP32s. Firmware lives in firmware/esphome.
  esphome:
    image: ghcr.io/esphome/esphome:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ESPHOME_PORT:-6052}:6052"
    volumes:
      - ../../firmware/esphome:/config
      - type: bind  # created first by setup/ensure_host_paths.py; Docker would make it a root-owned folder
        source: ${ESPHOME_SECRETS:-~/.agents/secrets/project_studio/esphome_secrets.yaml}
        target: /config/secrets.yaml
        read_only: true
        bind: { create_host_path: false }
  # Linux only (profile "linux", turned on by iniciar_estudio.sh): Ollama installed as a service listens on 127.0.0.1,
  # which containers cannot reach. This forwards the Docker bridge address (host.docker.internal) to it, without
  # exposing Ollama to the local network. Docker Desktop (Windows/macOS) already reaches the host and does not need it.
  ollama-bridge:
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    profiles: ["linux"]
    network_mode: host
    command: TCP-LISTEN:11434,bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr TCP:127.0.0.1:11434

volumes:
  ha_config:
  mosquitto_data:
  whisper_data:
  piper_data:
