# Voice home-automation stack: Home Assistant + MQTT broker + local speech-to-text and text-to-speech.
# The LLM runs in the ollama service (or the computer's Ollama, see below). All ports bind to 127.0.0.1 only, except Home
# Assistant when HA_BIND=0.0.0.0 (phone app on the home network; it has its own login).
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ha_config:/config
    ports:
      - "${HA_BIND:-127.0.0.1}:${HA_PORT:-8123}:8123"  # HA_BIND=0.0.0.0: the phone app reaches it on the home network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mosquitto, whisper, piper, wakeword]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${MQTT_WS_PORT:-9001}:9001"

  whisper:
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    command: --model ${WHISPER_MODEL:-small-int8} --language ${VOICE_LANGUAGE:-es}
    environment:
      # Biases recognition toward the names of devices and areas exposed in Home Assistant ("apaga el foco").
      # The token comes from a file (empty until setup fills it = no biasing); restart whisper after the first setup.
      WYO_WHISPER_HASS_TOKEN_FILE: /run/secrets/ha_token
      WYO_WHISPER_HASS_API: http://homeassistant:8123/api
    volumes:
      - whisper_data:/data
      - type: bind  # created first by setup/ensure_host_paths.py
        source: ${STUDIO_SECRETS_DIR:-~/.agents/secrets/project_studio}/ha_token
        target: /run/secrets/ha_token
        read_only: true
        bind: { create_host_path: false }

  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    command: --voice ${PIPER_VOICE:-es_ES-davefx-medium}
    volumes:
      - piper_data:/data

  # Hears the wake word ("okay nabu") in the audio the browser sends; the same detector as the real ESP32.
  # Own trained words (.json + .tflite) live in the user's data folder, not in the repo.
  wakeword:
    image: rhasspy/wyoming-microwakeword:latest
    restart: unless-stopped
    command: --uri tcp://0.0.0.0:10400 --custom-model-dir /custom
    volumes:
      - type: bind  # created first by setup/ensure_host_paths.py; Docker would make it root-owned
        source: ${WAKE_WORDS_DIR:-../../../project_studio_data/wake_words}
        target: /custom
        read_only: true
        bind: { create_host_path: false }

  # ESPHome dashboard: wireless (OTA) updates and logs of the real ESP32s. Firmware lives in firmware/esphome.
  esphome:
    image: ghcr.io/esphome/esphome:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ESPHOME_PORT:-6052}:6052"
    volumes:
      - ../../firmware/esphome:/config
      - type: bind  # created first by setup/ensure_host_paths.py; Docker would make it a root-owned folder
        source: ${ESPHOME_SECRETS:-~/.agents/secrets/project_studio/esphome_secrets.yaml}
        target: /config/secrets.yaml
        read_only: true
        bind: { create_host_path: false }
  # Local AI (Ollama), own volume. Profiles (COMPOSE_PROFILES in .env): "cpu" (default), "gpu" (NVIDIA) or none to use
  # the Ollama installed on the computer (OLLAMA_URL=http://host.docker.internal:11434, e.g. a Mac with its GPU).
  # Other containers reach it as "ollama"; this computer, on 127.0.0.1:OLLAMA_PORT.
  ollama: &ollama
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    profiles: ["cpu"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"  # 11435: the computer's own Ollama may hold 11434
    networks:
      default:
        aliases: [ollama]
  ollama-gpu:
    <<: *ollama
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  # Downloads OLLAMA_MODEL once (later runs find it in the volume and end at once).
  ollama-pull:
    image: ollama/ollama:0.40.16
    profiles: ["cpu", "gpu"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen3.5:4b}"]

volumes:
  ollama_data:
  ha_config:
  mosquitto_data:
  whisper_data:
  piper_data:
