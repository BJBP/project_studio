
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Circuito Maestro Corregido — Pines Exactos (ESP32-S3 + INMP441 + OLED + Relé 12V)</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: rgba(13, 20, 36, 0.92);
      --border: rgba(148, 163, 184, 0.24);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #070b14; color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #canvas-container { position: fixed; inset: 0; z-index: 1; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }

    #labels-left, #labels-right {
      position: fixed; top: 0; bottom: 0; z-index: 3; pointer-events: none; overflow: hidden;
    }
    #labels-left { left: 0; width: 100%; }
    #labels-right { right: 0; width: 50%; display: none; }

    #split-divider {
      position: fixed; top: 0; bottom: 0; left: 50%; width: 2px;
      background: rgba(56, 189, 248, 0.65); box-shadow: 0 0 12px rgba(0,0,0,0.5);
      z-index: 5; pointer-events: none; display: none;
    }

    .view-badge {
      position: fixed; top: 74px; z-index: 6;
      background: rgba(15, 23, 42, 0.86); color: #e2e8f0;
      padding: 4px 11px; border-radius: 999px; font-size: 11px; font-weight: 700;
      pointer-events: none; border: 1px solid rgba(148,163,184,0.35);
      transform: translateX(-50%); display: none;
    }

    .label-3d {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(10, 15, 28, 0.88); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #f1f5f9; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      white-space: nowrap; backdrop-filter: blur(6px); box-shadow: 0 4px 14px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .label-3d small { display: block; font-size: 9.5px; font-weight: 500; color: #cbd5e1; }
    .label-3d.warn { border-color: rgba(245, 158, 11, 0.85); color: #fef3c7; }
    .label-3d.ok   { border-color: rgba(34, 197, 94, 0.85); color: #dcfce7; }
    .label-3d.bad  { border-color: rgba(239, 68, 68, 0.9); background: rgba(69, 10, 10, 0.92); color: #fecaca; }

    /* Top Bar */
    .topbar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 15;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none;
    }
    .card-hud {
      pointer-events: auto; background: var(--panel); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 13px; padding: 8px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.42);
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #22c55e);
      display: grid; place-items: center; font-size: 15px; flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 13.5px; font-weight: 800; }
    .brand p { margin: 0; font-size: 11px; color: var(--muted); }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .mode-switch {
      display: inline-flex; background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 10px; padding: 2px; gap: 2px;
    }
    .mode-switch button { border: none; background: transparent; padding: 5px 8px; border-radius: 7px; font-size: 11px; }
    .mode-switch button.active {
      background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff;
      box-shadow: 0 2px 10px rgba(2,132,199,0.4);
    }

    button {
      appearance: none; border: 1px solid var(--border); background: rgba(30, 41, 59, 0.8);
      color: var(--text); padding: 5px 8px; border-radius: 8px; font-size: 11px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease;
    }
    button:hover { background: rgba(51, 65, 85, 0.95); border-color: rgba(148,163,184,0.5); }
    button.active { background: rgba(14, 165, 233, 0.25); border-color: var(--accent); color: #e0f2fe; }
    button.xray-btn.active { background: rgba(34, 197, 94, 0.22); border-color: var(--ok); color: #dcfce7; }
    button.primary { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: rgba(255,255,255,0.2); color: #fff; }
    button.success { background: linear-gradient(135deg, #16a34a, #0d9488); border-color: rgba(255,255,255,0.2); color: #fff; }

    /* Left Step Index */
    .steps-index {
      position: fixed; top: 74px; left: 10px; bottom: 245px; width: 228px; z-index: 12;
      background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--border);
      border-radius: 14px; display: flex; flex-direction: column; overflow: hidden;
      transition: transform 0.24s ease, opacity 0.2s;
    }
    .steps-index.collapsed { transform: translateX(-260px); opacity: 0; pointer-events: none; }
    .steps-index-hdr {
      padding: 9px 11px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--accent);
      border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.65);
    }
    .steps-scroll { flex: 1; overflow-y: auto; padding: 7px; }
    .steps-scroll::-webkit-scrollbar { width: 5px; }
    .steps-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 99px; }
    .step-item {
      display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px;
      margin-bottom: 3px; font-size: 11.5px; cursor: pointer; color: #cbd5e1; border: 1px solid transparent;
    }
    .step-item:hover { background: rgba(51, 65, 85, 0.55); }
    .step-item.active { background: rgba(14, 165, 233, 0.22); border-color: var(--accent); color: #fff; font-weight: 700; }
    .step-item.done .step-num { background: #16a34a; color: #fff; }
    .step-num {
      width: 20px; height: 20px; border-radius: 50%; background: rgba(51, 65, 85, 0.85);
      display: grid; place-items: center; font-size: 10px; font-weight: 800; flex-shrink: 0;
    }

    /* Bottom Tutor Card */
    .tutor-dock {
      position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 12;
      display: flex; justify-content: center; pointer-events: none;
    }
    .tutor-card {
      pointer-events: auto; width: 100%; max-width: 1160px;
      background: var(--panel); backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 16px; padding: 12px 16px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.55);
      display: grid; grid-template-columns: 1.55fr 1fr; gap: 15px; align-items: center;
    }
    .tutor-badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .step-pill {
      background: rgba(56, 189, 248, 0.2); border: 1px solid rgba(56, 189, 248, 0.5);
      color: #7dd3fc; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
    }
    .tutor-title { margin: 0 0 6px 0; font-size: 15.5px; font-weight: 800; color: #f8fafc; }
    .tutor-list {
      margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px;
      font-size: 12.5px; line-height: 1.4; color: #e2e8f0; user-select: text;
    }
    .tutor-list li { display: flex; align-items: flex-start; gap: 6px; }
    .tutor-list code {
      background: rgba(56, 189, 248, 0.16); color: #7dd3fc; padding: 1px 5px;
      border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    }
    .warn-line {
      margin-top: 6px; background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.42); color: #fde68a;
      padding: 5px 9px; border-radius: 8px; font-size: 11.5px; line-height: 1.35;
    }
    .danger-line {
      margin-top: 6px; background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.48); color: #fecaca;
      padding: 5px 9px; border-radius: 8px; font-size: 11.5px; line-height: 1.35;
    }

    .tutor-side { display: flex; flex-direction: column; gap: 8px; border-left: 1px solid var(--border); padding-left: 14px; }
    .mini-visual {
      background: rgba(15, 23, 42, 0.85); border: 1px solid var(--border);
      border-radius: 11px; padding: 7px 9px; min-height: 92px;
      display: flex; flex-direction: column; justify-content: center; font-size: 11.5px; color: #cbd5e1;
    }
    .wire-chip-list { display: flex; flex-direction: column; gap: 4px; max-height: 105px; overflow-y: auto; }
    .wire-chip {
      display: flex; align-items: center; gap: 7px; background: rgba(30, 41, 59, 0.7);
      padding: 4px 8px; border-radius: 7px; font-size: 11px; cursor: pointer; border: 1px solid transparent;
    }
    .wire-chip:hover { border-color: var(--accent); background: rgba(51, 65, 85, 0.9); }
    .wire-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.4); }

    .nav-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .nav-btns button { flex: 1; justify-content: center; padding: 7px 9px; font-size: 12px; }

    #hover-tooltip {
      position: fixed; z-index: 30; pointer-events: none;
      background: rgba(10, 15, 28, 0.96); border: 1px solid rgba(56, 189, 248, 0.65);
      border-radius: 10px; padding: 7px 10px; font-size: 12px; max-width: 280px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.55); display: none;
    }
    #hover-tooltip strong { display: block; color: #7dd3fc; margin-bottom: 2px; }
    #hover-tooltip span { color: #cbd5e1; font-size: 11.5px; }

    @media (max-width: 960px) {
      .steps-index { display: none; }
      .tutor-card { grid-template-columns: 1fr; padding: 10px 12px; gap: 9px; }
      .tutor-side { border-left: none; padding-left: 0; border-top: 1px solid var(--border); padding-top: 9px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="labels-left"></div>
  <div id="labels-right"></div>
  <div id="split-divider"></div>
  <div class="view-badge" id="badge-left" style="left:25%;">🧊 3D Normal (Cables Curvos)</div>
  <div class="view-badge" id="badge-right" style="left:75%;">📐 3D Isométrica Arriba (Cables Rectos)</div>
  <div id="hover-tooltip"><strong></strong><span></span></div>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="card-hud brand">
      <div class="brand-icon">🛠️</div>
      <div>
        <h1>Circuito Maestro 3D — Pines y Serigrafía Exactos</h1>
        <p>ESP32-S3 · INMP441 (SCK/WS/L-R · SD/VDD/GND) · MAX98357A · OLED · Relé · Tronic 12V + Foco + Cooler</p>
      </div>
    </div>

    <div class="card-hud toolbar">
      <div class="mode-switch">
        <button id="vm-3d" onclick="setViewMode('3d')">🧊 3D Normal</button>
        <button id="vm-iso" class="active" onclick="setViewMode('iso')">📐 3D Isométrica (Rectos)</button>
        <button id="vm-split" onclick="setViewMode('split')">⬛⬜ Ambos</button>
      </div>
      <div class="mode-switch" title="Qué conectar en el lado 12V del Relé">
        <button id="ld-bulb" onclick="setLoad12Mode('bulb')">💡 Foquito 12V</button>
        <button id="ld-fan" onclick="setLoad12Mode('fan')">🌀 Cooler 8025HD</button>
        <button id="ld-both" class="active" onclick="setLoad12Mode('both')">💡+🌀 Ambos</button>
      </div>
      <button id="btn-index" class="active" onclick="toggleIndex()">📑 Pasos</button>
      <button id="btn-xray" class="xray-btn" onclick="toggleXRay()">🔍 Rayos X</button>
      <button id="btn-opt-a" class="active" onclick="setMountOpt('A')">Opción A</button>
      <button id="btn-opt-b" onclick="setMountOpt('B')">Opción B</button>
      <button id="btn-12v" class="active" onclick="toggle12V()">🔌 Tronic 12V: ON</button>
      <button id="btn-labels" class="active" onclick="toggleLabels()">🏷️ Etiquetas</button>
      <button id="btn-sound" class="active" onclick="toggleSound()">🔊 Sonido</button>
      <button class="success" onclick="goToStep(12)">👁️ Todo Armado</button>
    </div>
  </div>

  <!-- Left Step Index -->
  <div class="steps-index" id="steps-index">
    <div class="steps-index-hdr">Ruta Paso a Paso (13 Pasos)</div>
    <div class="steps-scroll" id="steps-scroll"></div>
  </div>

  <!-- Bottom Guided Teaching Card -->
  <div class="tutor-dock">
    <div class="tutor-card">
      <div>
        <div class="tutor-badge-row">
          <span class="step-pill" id="step-pill">Paso 0</span>
          <span style="font-size:11.5px;color:#94a3b8;" id="step-sub"></span>
        </div>
        <h2 class="tutor-title" id="step-title"></h2>
        <ul class="tutor-list" id="step-bullets"></ul>
        <div id="step-alert"></div>
      </div>

      <div class="tutor-side">
        <div class="mini-visual" id="step-visual"></div>
        <div class="nav-btns">
          <button id="btn-prev" onclick="prevStep()">⬅ Anterior</button>
          <button class="primary" onclick="replayStepAnim()">▶ Repetir Anim.</button>
          <button class="success" id="btn-next" onclick="nextStep()">Siguiente ➔</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../vendor/three.min.js"></script>
  <script>
  (function() {
    if (typeof THREE === 'undefined') {
      document.getElementById('canvas-container').innerHTML =
        '<div style="padding:40px;color:#fca5a5;font-size:16px;">No se pudo cargar Three.js desde internet. Revisa tu conexión y recarga.</div>';
      return;
    }

    // =========================================================================
    // 1. ESCALA REAL MB-102 (1 unidad = 1 cm, paso = 0.254 cm)
    // =========================================================================
    const PITCH = 0.254;
    const BB_COLS = 63;
    const BB_Y = 0.90;
    function colX(c) { return (c - 31) * PITCH; }
    const ROW_Z = {
      backMinus: -10.5 * PITCH,
      backPlus:  -9.5 * PITCH,
      a: -5.5 * PITCH, b: -4.5 * PITCH, c: -3.5 * PITCH, d: -2.5 * PITCH, e: -1.5 * PITCH,
      f:  1.5 * PITCH, g:  2.5 * PITCH, h:  3.5 * PITCH, i:  4.5 * PITCH, j:  5.5 * PITCH,
      frontPlus:  9.5 * PITCH,
      frontMinus: 10.5 * PITCH
    };

    const RAIL_COLS = [];
    for (let g = 0; g < 10; g++) for (let k = 0; k < 5; k++) RAIL_COLS.push(2 + g * 6 + k);
    function nearestRailX(c) {
      let best = RAIL_COLS[0], md = 999;
      for (const rc of RAIL_COLS) { const d = Math.abs(rc - c); if (d < md) { md = d; best = rc; } }
      return colX(best);
    }

    const twinMode = new URLSearchParams(location.search).has('twin');
    const state = {
      viewMode: 'iso',
      load12Mode: 'both',
      stepIdx: 0,
      mountOpt: 'A',
      xray: false,
      dc12Connected: true,
      showLabels: true,
      soundOn: true,
      indexOpen: true,
      animTime: 0,
      animDur: 5.5,
      highlightedWire: null,
      relayOn: false,
      buzzerOn: false,
      fanSpeed: 0,
      activeSimProject: null,
      simProgress: 0,
      simTimer: null
    };

    // =========================================================================
    // 2. ESCENA, CÁMARAS Y LUCES
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const BG_DARK  = new THREE.Color(0x070b14);
    const BG_LIGHT = new THREE.Color(0xdbe3ec);
    const FOG_DARK = new THREE.FogExp2(0x070b14, 0.009);

    const perspCam = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
    const orthoCam = new THREE.OrthographicCamera(-14, 14, 8, -8, 0.1, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.autoClear = false;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xeef6ff, 0x334155, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.25);
    dirLight.position.set(10, 24, 14);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    const dCam = 22;
    dirLight.shadow.camera.left = -dCam; dirLight.shadow.camera.right = dCam;
    dirLight.shadow.camera.top = dCam;   dirLight.shadow.camera.bottom = -dCam;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.42);
    rimLight.position.set(-14, 12, -14);
    scene.add(rimLight);

    const bulbLight = new THREE.PointLight(0xffcf56, 0, 15, 1.5);
    bulbLight.position.set(12.2, 1.8, -6.2);
    scene.add(bulbLight);

    function makeTex(w, h, fn) {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      fn(cv.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
    }

    const MATS = {
      deskDark: new THREE.MeshStandardMaterial({
        map: makeTex(1024, 1024, (ctx, w, h) => {
          ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(56,189,248,0.08)'; ctx.lineWidth = 2;
          for (let i = 0; i <= w; i += 64) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
          }
        }), roughness: 0.85
      }),
      deskLight: new THREE.MeshStandardMaterial({
        map: makeTex(1024, 1024, (ctx, w, h) => {
          ctx.fillStyle = '#e5ebf2'; ctx.fillRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(100, 116, 139, 0.16)'; ctx.lineWidth = 2;
          for (let i = 0; i <= w; i += 64) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
          }
        }), roughness: 0.90
      }),
      bbPlastic: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.42, transparent: true, opacity: 1.0 }),
      bbRailPlastic: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.42, transparent: true, opacity: 1.0 }),
      holeDark: new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 }),
      gold: new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.24, metalness: 0.88 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.28, metalness: 0.85 }),
      silver: new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.22, metalness: 0.9 }),
      // Soldadura plateada brillante (visible incluso sin envMap)
      solder: new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.22, metalness: 0.35, emissive: 0x475569, emissiveIntensity: 0.28 }),
      copper: new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x16a34a, emissiveIntensity: 0.45, roughness: 0.3, metalness: 0.6 }),
      pcbBlack: new THREE.MeshStandardMaterial({ color: 0x0b101b, roughness: 0.5, metalness: 0.12 }),
      pcbBlue: new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.45, metalness: 0.15 }),
      pcbPurple: new THREE.MeshStandardMaterial({ color: 0x581c87, roughness: 0.4, metalness: 0.12 }),
      relayBlue: new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.32 }),
      termBlue: new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4 }),
      greenTerm: new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.42 }),
      redCap: new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.38 }),
      yellowPlastic: new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.45 }),
      blackPlastic: new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.55 }),
      cardboard: new THREE.MeshStandardMaterial({
        map: makeTex(512, 512, (ctx, w, h) => {
          ctx.fillStyle = '#9a6b3d'; ctx.fillRect(0, 0, w, h);
          for (let y = 0; y < h; y += 8) {
            ctx.fillStyle = y % 16 === 0 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, y, w, 4);
          }
          ctx.fillStyle = 'rgba(25,15,5,0.72)'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('BASE AISLANTE (CARTÓN / MADERA)', w/2, h - 55);
          ctx.fillStyle = '#fef08a'; ctx.font = 'bold 21px sans-serif';
          ctx.fillText('⚠️ NUNCA sobre bolsa plateada', w/2, h - 22);
        }), roughness: 0.92
      })
    };

    const desk = new THREE.Mesh(new THREE.BoxGeometry(58, 0.8, 36), MATS.deskLight);
    desk.position.set(0, -0.4, -2); desk.receiveShadow = true; scene.add(desk);

    const interactiveObjects = [];
    function registerHit(obj, title, desc, wireId = null) {
      obj.traverse(ch => {
        if (ch.isMesh) { ch.userData = { title, desc, wireId }; interactiveObjects.push(ch); }
      });
    }

    // =========================================================================
    // 3. PROTOBOARD MB-102 + RADIOGRAFÍA + AROS VERDES AL PASAR MOUSE
    // =========================================================================

    function isWireEnabled(w) {
      if (w.onlyB && state.mountOpt !== 'B') return false;
      if (w.loadFilter === 'bulb' && state.load12Mode === 'fan') return false;
      if (w.loadFilter === 'fan'  && state.load12Mode === 'bulb') return false;
      return true;
    }

    const wiresCurvedGroup = new THREE.Group(); scene.add(wiresCurvedGroup);
    const wiresStraightGroup = new THREE.Group(); scene.add(wiresStraightGroup);
    const wireCurvedMap = {};
    const wireStraightMap = {};
    const targetRingsGroup = new THREE.Group(); scene.add(targetRingsGroup);

    function buildStraightWire(w, pts, radius) {
      const grp = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: w.color, roughness: 0.38, metalness: 0.12 });
      const pieces = []; let totalLen = 0; const segLens = [];
      for (let i = 0; i < pts.length - 1; i++) { const l = pts[i].distanceTo(pts[i + 1]); segLens.push(l); totalLen += l; }
      let acc = 0; const up = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i], p2 = pts[i + 1], len = segLens[i];
        if (len < 0.001) continue;
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 10), mat); cyl.castShadow = true;
        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
        cyl.position.copy(mid); cyl.quaternion.setFromUnitVectors(up, dir);
        cyl.userData = { title: w.label, desc: w.info, wireId: w.id };
        grp.add(cyl); interactiveObjects.push(cyl);
        pieces.push({ mesh: cyl, p1, mid, dir, len, startF: acc / totalLen, endF: (acc + len) / totalLen, isSeg: true });
        if (i > 0) {
          const joint = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.05, 10, 10), mat);
          joint.position.copy(p1); joint.castShadow = true; joint.userData = { title: w.label, desc: w.info, wireId: w.id };
          grp.add(joint); interactiveObjects.push(joint);
          pieces.push({ mesh: joint, startF: acc / totalLen, endF: acc / totalLen, isSeg: false });
        }
        acc += len;
      }
      const caps = [];
      if (!w.isScrew) {
        [pts[0], pts[pts.length - 1]].forEach(pt => {
          const cap = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.24, 0.14), MATS.blackPlastic);
          cap.position.copy(pt); cap.position.y += 0.06; grp.add(cap); caps.push(cap);
        });
      }
      const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 }));
      grp.add(pulse);
      return { grp, mat, pieces, pts, totalLen, segLens, caps, pulse };
    }

    function samplePolyline(pts, segLens, totalLen, t) {
      let d = t * totalLen;
      for (let i = 0; i < segLens.length; i++) {
        if (d <= segLens[i] || i === segLens.length - 1) {
          const f = segLens[i] > 0 ? Math.min(1, d / segLens[i]) : 0;
          return new THREE.Vector3().lerpVectors(pts[i], pts[i + 1], f);
        }
        d -= segLens[i];
      }
      return pts[pts.length - 1].clone();
    }

    function rebuildWires() {
      [wiresCurvedGroup, wiresStraightGroup].forEach(g => { while (g.children.length) g.remove(g.children[0]); });
      for (const k in wireCurvedMap) delete wireCurvedMap[k];
      for (const k in wireStraightMap) delete wireStraightMap[k];
      for (let i = interactiveObjects.length - 1; i >= 0; i--) {
        if (interactiveObjects[i].userData && interactiveObjects[i].userData.wireId) interactiveObjects.splice(i, 1);
      }

      WIRES.forEach(w => {
        if (!isWireEnabled(w)) return;
        const ptsC = state.mountOpt === 'A' ? w.ptsA() : w.ptsB();
        if (ptsC && ptsC.length >= 2) {
          const curve = new THREE.CatmullRomCurve3(ptsC);
          const segs = 36, radSegs = 8;
          const geo = new THREE.TubeGeometry(curve, segs, w.thick || 0.04, radSegs, false);
          const totalIdx = geo.index ? geo.index.count : 0;
          const mat = new THREE.MeshStandardMaterial({ color: w.color, roughness: 0.42, metalness: 0.08 });
          const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = true;
          mesh.userData = { title: w.label, desc: w.info, wireId: w.id };
          wiresCurvedGroup.add(mesh); interactiveObjects.push(mesh);
          const caps = [];
          if (!w.isScrew) {
            [0.01, 0.99].forEach(t => {
              const p = curve.getPoint(t), tan = curve.getTangent(t);
              const cap = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.28), MATS.blackPlastic);
              cap.position.copy(p); cap.lookAt(p.clone().add(tan)); wiresCurvedGroup.add(cap); caps.push(cap);
            });
          }
          const pulse = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 10), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 }));
          wiresCurvedGroup.add(pulse);
          wireCurvedMap[w.id] = { w, mesh, curve, geo, mat, totalIdx, segs, radSegs, caps, pulse, pStart: ptsC[0], pEnd: ptsC[ptsC.length - 1] };
        }
        const ptsS = state.mountOpt === 'A' ? w.stA() : w.stB();
        if (ptsS && ptsS.length >= 2) {
          const sw = buildStraightWire(w, ptsS, w.thick || 0.042);
          wiresStraightGroup.add(sw.grp); wireStraightMap[w.id] = sw;
        }
      });
    }

    function refreshTargetRings() {
      while (targetRingsGroup.children.length) targetRingsGroup.remove(targetRingsGroup.children[0]);
      WIRES.forEach(w => {
        if (w.minStep !== state.stepIdx || !isWireEnabled(w)) return;
        const wm = wireCurvedMap[w.id]; if (!wm) return;
        [wm.pStart, wm.pEnd].forEach(pt => {
          const ring = new THREE.Mesh(new THREE.RingGeometry(0.10, 0.18, 20), new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
          ring.rotation.x = -Math.PI / 2; ring.position.set(pt.x, Math.max(pt.y, BB_Y) + 0.03, pt.z);
          targetRingsGroup.add(ring);
        });
      });
    }

    for (let i = 0; i < 3; i++) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(0.45 + i * 0.35, 0.04, 8, 28, Math.PI * 0.65), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0 }));
      r.rotation.x = Math.PI / 2; r.rotation.z = 2.0; scene.add(r); wifiRings.push(r);

    function projectLabelSet(map, cam, w, h) {
      for (const k in map) {

        const showLoad = !d.load || state.load12Mode === 'both' || state.load12Mode === d.load;
        if (!state.showLabels || !showStep || !showLoad) { el.style.display = 'none'; continue; }
        const v = d.pos().project(cam);
        if (v.z > 1 || v.z < -1) { el.style.display = 'none'; continue; }
        el.style.display = 'block';
        el.innerHTML = `${d.text}<small>${d.sub()}</small>`;
        el.style.left = `${(v.x * 0.5 + 0.5) * w}px`;

    let audioCtx = null;
    function getAudio() {
      if (!state.soundOn) return null;
      if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playClick() {
      const ctx = getAudio(); if (!ctx) return;
      const now = ctx.currentTime, buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.006));
      const s = ctx.createBufferSource(); s.buffer = buf; const g = ctx.createGain(); g.gain.value = 0.45; s.connect(g).connect(ctx.destination); s.start(now);
    }
    function playBeep() {
      const ctx = getAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      [0, 0.22].forEach(off => {
        const osc = ctx.createOscillator(), g = ctx.createGain(); osc.type = 'square'; osc.frequency.value = 2300;
        g.gain.setValueAtTime(0.001, now+off); g.gain.linearRampToValueAtTime(0.08, now+off+0.02); g.gain.exponentialRampToValueAtTime(0.001, now+off+0.15);
        osc.connect(g).connect(ctx.destination); osc.start(now+off); osc.stop(now+off+0.16);
      });
    }
    function playChime() {
      const ctx = getAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      [523, 659, 784].forEach((f, i) => {
        const osc = ctx.createOscillator(), g = ctx.createGain(); osc.frequency.value = f;
        g.gain.setValueAtTime(0.001, now+i*0.1); g.gain.linearRampToValueAtTime(0.09, now+i*0.1+0.02); g.gain.exponentialRampToValueAtTime(0.001, now+i*0.1+0.24);
        osc.connect(g).connect(ctx.destination); osc.start(now+i*0.1); osc.stop(now+i*0.1+0.26);
      });
    }

    const cam3DState  = { theta: 0.35, phi: 0.85, radius: 27.5, target: new THREE.Vector3(1.5, 1, -1.5), goalTheta: 0.35, goalPhi: 0.85, goalRadius: 27.5, goalTarget: new THREE.Vector3(1.5, 1, -1.5) };
    const camIsoState = { theta: 0.16, phi: 0.44, size: 11.8,   target: new THREE.Vector3(1.6, 0.5, -1.5), goalTheta: 0.16, goalPhi: 0.44, goalSize: 11.8,   goalTarget: new THREE.Vector3(1.6, 0.5, -1.5) };

    function getViewportInfo(clientX, clientY) {
      const W = window.innerWidth, H = window.innerHeight;
      if (state.viewMode === '3d') return { which: '3d', cam: perspCam, ndcX: (clientX / W) * 2 - 1, ndcY: -(clientY / H) * 2 + 1 };
      if (state.viewMode === 'iso') return { which: 'iso', cam: orthoCam, ndcX: (clientX / W) * 2 - 1, ndcY: -(clientY / H) * 2 + 1 };
      const half = W / 2;
      if (clientX < half) return { which: '3d', cam: perspCam, ndcX: (clientX / half) * 2 - 1, ndcY: -(clientY / H) * 2 + 1 };
      return { which: 'iso', cam: orthoCam, ndcX: ((clientX - half) / half) * 2 - 1, ndcY: -(clientY / H) * 2 + 1 };
    }

    function isVisibleDeep(obj) {
      let cur = obj;
      while (cur) { if (!cur.visible) return false; cur = cur.parent; }
      return true;
    }

    let isDragging = false, isPanning = false, dragWhich = 'iso';
    let prevPtr = { x: 0, y: 0 }, downPtr = { x: 0, y: 0 };
    const raycaster = new THREE.Raycaster();
    const bbPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -BB_Y);
    const hitPt = new THREE.Vector3();
    const tooltip = document.getElementById('hover-tooltip');
    function hideHoverHoles() { hoverRingPool.forEach(m => m.visible = false); }

    renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
    renderer.domElement.addEventListener('pointerdown', e => {
      const vp = getViewportInfo(e.clientX, e.clientY);
      isDragging = true; dragWhich = vp.which; isPanning = e.button === 2 || e.shiftKey;
      prevPtr = { x: e.clientX, y: e.clientY }; downPtr = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', e => {
      if (isDragging) {
        const dx = e.clientX - prevPtr.x, dy = e.clientY - prevPtr.y; prevPtr = { x: e.clientX, y: e.clientY };
        const st = dragWhich === '3d' ? cam3DState : camIsoState, cam = dragWhich === '3d' ? perspCam : orthoCam;
        if (isPanning) {
          const scale = dragWhich === '3d' ? st.goalRadius * 0.0014 : st.goalSize * 0.0024;
          const r = new THREE.Vector3(), u = new THREE.Vector3(); cam.matrix.extractBasis(r, u, new THREE.Vector3());
          r.y = 0; r.normalize(); const f = new THREE.Vector3(-Math.sin(st.theta), 0, -Math.cos(st.theta));
          st.goalTarget.addScaledVector(r, -dx * scale).addScaledVector(f, dy * scale);
        } else {
          st.goalTheta -= dx * 0.0065;
          st.goalPhi = Math.max(dragWhich === 'iso' ? 0.05 : 0.14, Math.min(Math.PI/2 - 0.04, st.goalPhi - dy * 0.0065));
        }
        tooltip.style.display = 'none'; hideHoverHoles(); return;
      }

      if (e.target !== renderer.domElement) return;
      const vp = getViewportInfo(e.clientX, e.clientY);
      wiresCurvedGroup.visible = (vp.which === '3d'); wiresStraightGroup.visible = (vp.which === 'iso');

      raycaster.setFromCamera(new THREE.Vector2(vp.ndcX, vp.ndcY), vp.cam);
      hideHoverHoles();
      let holeTooltip = null;
      if (raycaster.ray.intersectPlane(bbPlane, hitPt)) {
        for (let col = 0; col < BB_COLS; col++) {
          if (Math.abs(hitPt.x - colX(col)) < 0.12) {
            for (const rk of rowKeys) {
              if (Math.abs(hitPt.z - ROW_Z[rk]) < 0.12) {
                const groupRows = ['a','b','c','d','e'].includes(rk) ? ['a','b','c','d','e'] : ['f','g','h','i','j'];
                groupRows.forEach((gr, idx) => { hoverRingPool[idx].position.set(colX(col), BB_Y + 0.02, ROW_Z[gr]); hoverRingPool[idx].visible = true; });
                holeTooltip = { title: `Protoboard · Hueco ${rk}${col + 1}`, desc: `Conectado por debajo con ${groupRows.map(r => r + (col + 1)).join(', ')}.` };
                break;
              }
            }
            if (holeTooltip) break;
          }
        }
        if (!holeTooltip) {
          if (Math.abs(hitPt.z - ROW_Z.backMinus) < 0.12 && Math.abs(hitPt.x) < 8.1) {
            RAIL_COLS.forEach((rc, idx) => { hoverRingPool[idx].position.set(colX(rc), BB_Y + 0.02, ROW_Z.backMinus); hoverRingPool[idx].visible = true; });
            holeTooltip = { title: 'Carril Azul (−) GND', desc: 'Todos estos huecos están conectados entre sí (Tierra común).' };
          } else if (Math.abs(hitPt.z - ROW_Z.backPlus) < 0.12 && Math.abs(hitPt.x) < 8.1) {
            RAIL_COLS.forEach((rc, idx) => { hoverRingPool[idx].position.set(colX(rc), BB_Y + 0.02, ROW_Z.backPlus); hoverRingPool[idx].visible = true; });
            holeTooltip = { title: 'Carril Rojo (+) 5V', desc: 'Todos estos huecos están conectados entre sí (5V).' };
          }
        }
      }

      const hits = raycaster.intersectObjects(interactiveObjects, false).filter(h => isVisibleDeep(h.object));
      const nonBoardHit = hits.find(h => h.object.userData.wireId || !h.object.userData.title.startsWith('Protoboard'));
      const chosen = nonBoardHit ? nonBoardHit.object.userData : (holeTooltip || (hits[0] ? hits[0].object.userData : null));
      if (chosen) {
        tooltip.querySelector('strong').textContent = chosen.title || ''; tooltip.querySelector('span').textContent = chosen.desc || '';
        tooltip.style.left = Math.min(window.innerWidth - 285, e.clientX + 14) + 'px'; tooltip.style.top = Math.min(window.innerHeight - 105, e.clientY + 14) + 'px';
        tooltip.style.display = 'block'; renderer.domElement.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none'; renderer.domElement.style.cursor = 'grab';
      }
    });

    window.addEventListener('pointerup', e => {
      if (!isDragging) return;
      isDragging = false;
      if (Math.hypot(e.clientX - downPtr.x, e.clientY - downPtr.y) < 5 && e.button === 0 && e.target === renderer.domElement) {
        const vp = getViewportInfo(e.clientX, e.clientY);
        wiresCurvedGroup.visible = (vp.which === '3d'); wiresStraightGroup.visible = (vp.which === 'iso');
        raycaster.setFromCamera(new THREE.Vector2(vp.ndcX, vp.ndcY), vp.cam);
        const hits = raycaster.intersectObjects(interactiveObjects, false).filter(h => isVisibleDeep(h.object));
        const wireHit = hits.find(h => h.object.userData.wireId);
        state.highlightedWire = wireHit ? wireHit.object.userData.wireId : null;
        const part = twinMode ? hits.map(h => twinPart(h.object)).find(Boolean) : null;
        if (part) parent.postMessage({ type: 'studio-twin-click', part }, location.origin);
      }

    renderer.domElement.addEventListener('wheel', e => {
      e.preventDefault();
      const vp = getViewportInfo(e.clientX, e.clientY);
      if (vp.which === '3d') cam3DState.goalRadius = Math.max(3.6, Math.min(44, cam3DState.goalRadius + e.deltaY * 0.013));
      else camIsoState.goalSize = Math.max(2.2, Math.min(22, camIsoState.goalSize * (e.deltaY > 0 ? 1.12 : 0.89)));
    }, { passive: false });

    function updateOrthoFrustum(aspect) {
      const s = camIsoState.size;
      orthoCam.left = -s * aspect; orthoCam.right = s * aspect; orthoCam.top = s; orthoCam.bottom = -s;

      rebuildWires(); refreshTargetRings();
      if (STEPS[state.stepIdx].visualHtml === 'WIRE_LIST') renderTutorCard();
    };

    function renderStepsIndex() {
      document.getElementById('steps-scroll').innerHTML = STEPS.map((s, i) => `
        <div class="step-item ${i === state.stepIdx ? 'active' : i < state.stepIdx ? 'done' : ''}" onclick="goToStep(${i})">
          <div class="step-num">${i < state.stepIdx ? '✓' : i}</div>
          <div style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.pill}</div>
        </div>`).join('');
    }

    function renderTutorCard() {
      const s = STEPS[state.stepIdx];
      document.getElementById('step-pill').textContent = `${s.pill} (${state.stepIdx + 1}/${STEPS.length})`;
      document.getElementById('step-sub').textContent = s.sub;
      document.getElementById('step-title').textContent = s.title;
      document.getElementById('step-bullets').innerHTML = s.bullets.map(b => `<li><span>•</span><span>${b}</span></li>`).join('');

      const alertDiv = document.getElementById('step-alert');
      if (s.alertText) {
        const cls = s.alertType === 'danger' ? 'danger-line' : 'warn-line';
        const style = s.alertType === 'ok' ? 'style="background:rgba(34,197,94,0.14);border-color:rgba(34,197,94,0.45);color:#bbf7d0;"' : '';
        alertDiv.innerHTML = `<div class="${cls}" ${style}>${s.alertText}</div>`;
      } else alertDiv.innerHTML = '';
      if (s.tryIt) {
        alertDiv.insertAdjacentHTML('beforeend', `<details class="warn-line" style="margin-top:6px;background:rgba(34,197,94,0.10);border-color:rgba(34,197,94,0.4);color:#dcfce7;">
          <summary style="cursor:pointer;font-weight:800;">✅ Pruébalo</summary>
          <div><b>Qué deberías ver:</b> ${s.tryIt.see}</div><div><b>Si no funciona:</b> ${s.tryIt.fix}</div></details>`);
      }

      const visDiv = document.getElementById('step-visual');
      if (s.visualHtml === 'WIRE_LIST') {
        const stepWires = WIRES.filter(w => w.minStep === state.stepIdx && isWireEnabled(w));
        visDiv.innerHTML = `<div style="font-size:11px;font-weight:800;color:#7dd3fc;margin-bottom:4px;">Cables de este paso (toca para resaltar):</div>
          <div class="wire-chip-list">` + stepWires.map(w => `
            <div class="wire-chip" onclick="highlightWire('${w.id}')">
              <div class="wire-dot" style="background:${w.hex};"></div>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${w.label}</span>
            </div>`).join('') + `</div>`;
      } else if (s.visualHtml === 'TEST_PANEL') {
        visDiv.innerHTML = `<div style="display:flex;flex-direction:column;gap:5px;">
          <b style="color:#86efac;font-size:11.5px;">Prueba tu maqueta 12V o simula uno de los 5 modos:</b>
          <div style="display:flex;gap:4px;flex-wrap:wrap;">
            <button class="primary" style="flex:1;justify-content:center;padding:5px 7px;font-size:11px;" onclick="testRelay()">⚡ Relé 12V (Foco/Cooler)</button>
            <button class="primary" style="flex:1;justify-content:center;padding:5px 7px;font-size:11px;" onclick="testBuzzer()">🔔 Buzzer</button>
            <button class="primary" style="flex:1;justify-content:center;padding:5px 7px;font-size:11px;" onclick="testSpeaker()">🔊 Parlante</button>
          </div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;">
            <button style="flex:1;justify-content:center;padding:4px 6px;font-size:10.5px;" onclick="runProjectSim('voz')">🎙️ Voz</button>
            <button style="flex:1;justify-content:center;padding:4px 6px;font-size:10.5px;" onclick="runProjectSim('seguridad')">🚨 Segur.</button>
            <button style="flex:1;justify-content:center;padding:4px 6px;font-size:10.5px;" onclick="runProjectSim('salud')">🪑 Salud</button>
            <button style="flex:1;justify-content:center;padding:4px 6px;font-size:10.5px;" onclick="runProjectSim('intercom')">📞 Interc.</button>
            <button style="flex:1;justify-content:center;padding:4px 6px;font-size:10.5px;" onclick="runProjectSim('acustico')">💥 Acúst.</button>
          </div>
        </div>`;
      } else {
        visDiv.innerHTML = s.visualHtml;
      }
      document.getElementById('btn-prev').disabled = state.stepIdx === 0;
      document.getElementById('btn-next').textContent = state.stepIdx === STEPS.length - 1 ? '✓ Listo' : 'Siguiente ➔';
    }

    window.highlightWire = function(id) { state.highlightedWire = (state.highlightedWire === id) ? null : id; };
    window.testRelay = function() { state.relayOn = !state.relayOn; playClick(); updateLaptopScreen(); };
    window.testBuzzer = function() { state.buzzerOn = true; playBeep(); updateLaptopScreen(); setTimeout(() => { state.buzzerOn = false; updateLaptopScreen(); }, 650); };
    window.testSpeaker = function() { playChime(); };
    window.runProjectSim = function(proj) {
      if (state.simTimer) clearTimeout(state.simTimer);
      state.activeSimProject = proj; state.simProgress = 0;
      state.relayOn = ['voz','seguridad','acustico'].includes(proj);
      state.buzzerOn = ['seguridad','salud','acustico'].includes(proj);
      if (state.relayOn) playClick(); if (state.buzzerOn) playBeep();
      if (['voz','seguridad','salud','intercom'].includes(proj)) playChime();
      updateLaptopScreen();
      state.simTimer = setTimeout(() => { state.activeSimProject = null; state.buzzerOn = false; state.relayOn = false; updateLaptopScreen(); }, 3600);
    };

    window.goToStep = function(idx) {
      state.stepIdx = Math.max(0, Math.min(STEPS.length - 1, idx));
      state.animTime = 0; state.highlightedWire = null; state.activeSimProject = null;
      const c3 = STEPS[state.stepIdx].cam3D;
      cam3DState.goalTheta = c3.theta; cam3DState.goalPhi = c3.phi; cam3DState.goalRadius = c3.radius; cam3DState.goalTarget.copy(c3.target);
      const ci = STEPS[state.stepIdx].camIso;
      camIsoState.goalTheta = ci.theta; camIsoState.goalPhi = ci.phi; camIsoState.goalSize = ci.size; camIsoState.goalTarget.copy(ci.target);
      if (state.stepIdx === 4) setXRay(true);
      else if (state.xray) setXRay(false);
      refreshTargetRings(); renderStepsIndex(); renderTutorCard(); updateLaptopScreen();
    };
    window.nextStep = function() { if (state.stepIdx < STEPS.length - 1) goToStep(state.stepIdx + 1); };
    window.prevStep = function() { if (state.stepIdx > 0) goToStep(state.stepIdx - 1); };
    window.replayStepAnim = function() { state.animTime = 0; };

    function setXRay(on) {
      state.xray = on; document.getElementById('btn-xray').classList.toggle('active', on);
      MATS.bbPlastic.opacity = on ? 0.34 : 1.0; MATS.bbRailPlastic.opacity = on ? 0.34 : 1.0;
      xrayGroup.visible = on; backRail.userData.railXray.visible = on; frontRail.userData.railXray.visible = on;
    }
    window.toggleXRay = function() { setXRay(!state.xray); };
    window.setMountOpt = function(opt) {
      state.mountOpt = opt;
      document.getElementById('btn-opt-a').classList.toggle('active', opt === 'A');
      document.getElementById('btn-opt-b').classList.toggle('active', opt === 'B');
      cardboardBase.visible = (opt === 'B' && state.stepIdx >= 5);
      rebuildWires(); refreshTargetRings();
      if (STEPS[state.stepIdx].visualHtml === 'WIRE_LIST') renderTutorCard();
    };
    window.toggle12V = function() {
      state.dc12Connected = !state.dc12Connected;
      const b = document.getElementById('btn-12v'); b.classList.toggle('active', state.dc12Connected);
      b.textContent = state.dc12Connected ? '🔌 Tronic 12V: ON' : '🛡️ Solo Clic (Sin 12V)';
      adapterGroup.position.x = state.dc12Connected ? 19.0 : 20.6;
    };
    window.toggleLabels = function() { state.showLabels = !state.showLabels; document.getElementById('btn-labels').classList.toggle('active', state.showLabels); };
    window.toggleSound = function() {
      state.soundOn = !state.soundOn; const b = document.getElementById('btn-sound');
      b.classList.toggle('active', state.soundOn); b.textContent = state.soundOn ? '🔊 Sonido' : '🔇 Silencio';
    };
    window.toggleIndex = function() {
      state.indexOpen = !state.indexOpen;
      document.getElementById('steps-index').classList.toggle('collapsed', !state.indexOpen);
      document.getElementById('btn-index').classList.toggle('active', state.indexOpen);
    };

    // =========================================================================
    // 14. LOOP DE ANIMACIÓN Y RENDER DUAL-CÁMARA
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05), t = clock.getElapsedTime();
      state.animTime = Math.min(state.animDur, state.animTime + dt);
      const p = state.animTime / state.animDur;

      cam3DState.theta += (cam3DState.goalTheta - cam3DState.theta) * 0.12;
      cam3DState.phi   += (cam3DState.goalPhi   - cam3DState.phi)   * 0.12;
      cam3DState.radius+= (cam3DState.goalRadius- cam3DState.radius)* 0.12;
      cam3DState.target.lerp(cam3DState.goalTarget, 0.12);
      perspCam.position.set(
        cam3DState.target.x + cam3DState.radius * Math.sin(cam3DState.phi) * Math.sin(cam3DState.theta),
        cam3DState.target.y + cam3DState.radius * Math.cos(cam3DState.phi),
        cam3DState.target.z + cam3DState.radius * Math.sin(cam3DState.phi) * Math.cos(cam3DState.theta)
      );
      perspCam.lookAt(cam3DState.target);

      camIsoState.theta += (camIsoState.goalTheta - camIsoState.theta) * 0.12;
      camIsoState.phi   += (camIsoState.goalPhi   - camIsoState.phi)   * 0.12;
      camIsoState.size  += (camIsoState.goalSize  - camIsoState.size)  * 0.12;
      camIsoState.target.lerp(camIsoState.goalTarget, 0.12);
      const isoDist = 36;
      orthoCam.position.set(
        camIsoState.target.x + isoDist * Math.sin(camIsoState.phi) * Math.sin(camIsoState.theta),
        camIsoState.target.y + isoDist * Math.cos(camIsoState.phi),
        camIsoState.target.z + isoDist * Math.sin(camIsoState.phi) * Math.cos(camIsoState.theta)
      );
      orthoCam.lookAt(camIsoState.target);
      const W = window.innerWidth, H = window.innerHeight;
      const viewW = state.viewMode === 'split' ? Math.floor(W / 2) : W;
      updateOrthoFrustum(viewW / H);

      const s = state.stepIdx;

      if (state.mountOpt === 'A' && s >= 5) {
        const slideT = s === 5 ? Math.min(1, p / 0.45) : 1;
        frontRail.position.lerpVectors(new THREE.Vector3(0,0,10*PITCH), new THREE.Vector3(4.5,0,5.2), slideT);
        frontRail.rotation.y = 0.08 * slideT;
      } else { frontRail.position.lerp(new THREE.Vector3(0,0,10*PITCH), 0.15); frontRail.rotation.y *= 0.85; }
      cardboardBase.visible = (state.mountOpt === 'B' && s >= 5);

      ironGroup.visible = (s === 1 || s === 2 || s === 3);
      solderWireGroup.visible = (s === 1 || s === 2 || s === 3);
      demoSolderBoard.visible = (s === 1 || s === 2 || s === 3);

      if (s === 1) {
        micGroup.position.set(colX(33), 1.35, 5.2); micGroup.rotation.x = 0.25;
        micPinsGroup.position.y = -0.85 * (1 - Math.min(1, p / 0.28));
        micSolderCones.forEach((c, idx) => c.scale.setScalar(Math.max(0.01, Math.min(1, (p - 0.28 - idx * 0.09) / 0.12))));
        const ap = Math.min(5, Math.floor(Math.max(0, p - 0.28) / 0.10)), px = colX(33) + ((ap % 3) - 1) * PITCH, pz = 5.2 + (ap < 3 ? -2.5 * PITCH : 2.5 * PITCH);
        ironGroup.position.set(px + 0.15, 1.55 + Math.sin(t * 6) * 0.04, pz); solderWireGroup.position.set(px - 0.12, 1.55 + Math.sin(t * 6) * 0.04, pz);
        demoSolderBoard.position.set(colX(33) + 2.5, 1.45, 5.2);
      } else {
        micPinsGroup.position.y = 0; micSolderCones.forEach(c => c.scale.setScalar(1)); micGroup.rotation.x = 0;
        if (s < 7) micGroup.position.lerp(MIC_PARK_POS, 0.15);
        else if (s === 7) micGroup.position.lerpVectors(MIC_BOARD_POS.clone().add(new THREE.Vector3(0, 1.5, 0)), MIC_BOARD_POS, Math.min(1, p / 0.25));
        else micGroup.position.lerp(MIC_BOARD_POS, 0.2);
      }

      if (s === 2) {
        ampGroup.position.set(colX(44), 1.35, 5.2); ampGroup.rotation.x = 0.22;
        const sl = Math.min(1, p / 0.28); ampPinsGroup.position.y = -0.85 * (1 - sl); ampTermGroup.position.y = 1.15 * (1 - sl);
        ampSolderCones.forEach((c, idx) => c.scale.setScalar(Math.max(0.01, Math.min(1, (p - 0.28 - idx * 0.08) / 0.10))));
        const ax = colX(44) + (Math.min(6, Math.floor(Math.max(0, p - 0.28) / 0.09)) - 3) * PITCH;
        ironGroup.position.set(ax + 0.15, 1.55, 4.45); solderWireGroup.position.set(ax - 0.12, 1.55, 4.45);
        demoSolderBoard.position.set(colX(44) + 2.8, 1.45, 5.2);
      } else {
        ampPinsGroup.position.y = 0; ampTermGroup.position.y = 0; ampSolderCones.forEach(c => c.scale.setScalar(1)); ampGroup.rotation.x = 0;
        if (s < 8) ampGroup.position.lerp(AMP_PARK_POS, 0.15);
        else if (s === 8) ampGroup.position.lerpVectors(AMP_BOARD_POS.clone().add(new THREE.Vector3(0, 1.5, 0)), AMP_BOARD_POS, Math.min(1, p / 0.25));
        else ampGroup.position.lerp(AMP_BOARD_POS, 0.2);
      }

      if (s === 3) {
        espGroup.position.set(-4.5, 1.35, 5.5); espGroup.rotation.x = 0.15;
        espHeadersGroup.position.y = -0.85 * (1 - Math.min(1, p / 0.30));
        espSolderCones.forEach((c, idx) => c.scale.setScalar(Math.max(0.01, Math.min(1, (p - 0.30 - Math.floor(idx / 2) * 0.025) / 0.12))));
        const ex = -4.5 - 2.667 + Math.min(21, Math.floor(Math.max(0, p - 0.30) / 0.026)) * PITCH;
        ironGroup.position.set(ex + 0.15, 1.55, 5.5 + 5 * PITCH); solderWireGroup.position.set(ex - 0.12, 1.55, 5.5 + 5 * PITCH);
        demoSolderBoard.position.set(-0.2, 1.45, 5.5);
      } else {
        espHeadersGroup.position.y = 0; espSolderCones.forEach(c => c.scale.setScalar(1)); espGroup.rotation.x = 0;
        const targetPos = state.mountOpt === 'A' ? ESP_POS_A : ESP_POS_B;
        if (s < 5) espGroup.position.lerp(ESP_PARK_POS, 0.15);
        else if (s === 5) espGroup.position.lerpVectors(targetPos.clone().add(new THREE.Vector3(0, 1.8, 0)), targetPos, Math.max(0, Math.min(1, (p - 0.45) / 0.45)));
        else espGroup.position.lerp(targetPos, 0.2);
      }

      if (espGroup.userData.uartRing) { espGroup.userData.uartRing.visible = (s === 12); espGroup.userData.uartRing.scale.setScalar(1 + Math.sin(t * 5) * 0.15); }
      if (s < 9) buzzerGroup.position.lerp(BUZ_PARK_POS, 0.15);
      else if (s === 9) buzzerGroup.position.lerpVectors(BUZ_BOARD_POS.clone().add(new THREE.Vector3(0, 1.5, 0)), BUZ_BOARD_POS, Math.min(1, p / 0.25));
      else buzzerGroup.position.lerp(BUZ_BOARD_POS, 0.2);

      if (s < 10) oledGroup.position.lerp(OLED_PARK_POS, 0.15);
      else if (s === 10) oledGroup.position.lerpVectors(OLED_BOARD_POS.clone().add(new THREE.Vector3(0, 1.5, 0)), OLED_BOARD_POS, Math.min(1, p / 0.25));
      else oledGroup.position.lerp(OLED_BOARD_POS, 0.2);

      if (state.activeSimProject) state.simProgress = (state.simProgress + dt * 0.85) % 1.0;
      const stepWires = WIRES.filter(w => w.minStep === s && isWireEnabled(w));

      WIRES.forEach(w => {
        if (!isWireEnabled(w)) return;
        const idxInStep = stepWires.indexOf(w);
        const span = 0.70 / Math.max(1, stepWires.length);
        const prog = s < w.minStep ? 0 : (s > w.minStep ? 1 : Math.max(0, Math.min(1, (p - (0.26 + idxInStep * span)) / (span * 0.9))));
        const simOn = state.activeSimProject && w.proj.includes(state.activeSimProject) && !w.id.startsWith('w_esp_') && w.id !== 'w_bridge' && s > w.minStep;
        const isHi = state.highlightedWire === w.id;

        const wc = wireCurvedMap[w.id];
        if (wc) {
          if (prog <= 0.01) { wc.mesh.visible = false; wc.caps.forEach(c => c.visible = false); wc.pulse.material.opacity = 0; }
          else {
            wc.mesh.visible = true; wc.geo.setDrawRange(0, prog >= 0.99 ? wc.totalIdx : Math.floor(wc.segs * prog) * wc.radSegs * 6);
            if (wc.caps[0]) wc.caps[0].visible = prog > 0.03; if (wc.caps[1]) wc.caps[1].visible = prog > 0.92;
            if (simOn) { wc.pulse.position.copy(wc.curve.getPoint(state.simProgress)); wc.pulse.material.opacity = 0.95; wc.pulse.material.color.setHex(w.color === 0x0f172a ? 0x38bdf8 : w.color); }
            else wc.pulse.material.opacity = 0;
          }
          wc.mat.emissive.setHex(isHi ? 0x38bdf8 : 0x000000); wc.mat.emissiveIntensity = isHi ? (1.1 + Math.sin(t * 7) * 0.5) : 0;
        }

        const ws = wireStraightMap[w.id];
        if (ws) {
          if (prog <= 0.01) ws.grp.visible = false;
          else {
            ws.grp.visible = true;
            ws.pieces.forEach(pc => {
              if (!pc.isSeg) pc.mesh.visible = prog >= pc.startF;
              else {
                if (prog <= pc.startF) pc.mesh.visible = false;
                else if (prog >= pc.endF) { pc.mesh.visible = true; pc.mesh.scale.set(1, 1, 1); pc.mesh.position.copy(pc.mid); }
                else {
                  const lp = (prog - pc.startF) / (pc.endF - pc.startF);
                  pc.mesh.visible = true; pc.mesh.scale.set(1, lp, 1);
                  pc.mesh.position.copy(pc.p1).addScaledVector(pc.dir, pc.len * lp * 0.5);
                }
              }
            });
            if (ws.caps[0]) ws.caps[0].visible = prog > 0.03; if (ws.caps[1]) ws.caps[1].visible = prog > 0.94;
            if (simOn) { ws.pulse.position.copy(samplePolyline(ws.pts, ws.segLens, ws.totalLen, state.simProgress)); ws.pulse.material.opacity = 0.95; ws.pulse.material.color.setHex(w.color === 0x0f172a ? 0x38bdf8 : w.color); }
            else ws.pulse.material.opacity = 0;
          }
          ws.mat.emissive.setHex(isHi ? 0x38bdf8 : 0x000000); ws.mat.emissiveIntensity = isHi ? (1.1 + Math.sin(t * 7) * 0.5) : 0;
        }
      });

      const wifiOrigin = espGroup.position.clone().add(new THREE.Vector3(2.2, 0.4, 0));
      const showWifi = state.activeSimProject && state.activeSimProject !== 'acustico';
      wifiRings.forEach((r, i) => {
        if (showWifi) {
          const ph = (t * 1.6 + i * 0.33) % 1;
          r.position.copy(wifiOrigin).lerp(laptopGroup.position.clone().add(new THREE.Vector3(2.0, 2.2, 0)), ph * 0.45);
          r.scale.setScalar(0.6 + ph * 1.4); r.material.opacity = (1 - ph) * 0.75;
        } else r.material.opacity = 0;
      });

      targetRingsGroup.children.forEach(r => r.scale.setScalar(1 + Math.sin(t * 5) * 0.22));
      relayPwrLedMat.emissiveIntensity = s >= 11 ? 1.8 : 0.15;
      relayLedMat.emissiveIntensity = state.relayOn ? 2.8 : 0.1;

      const power12Active = state.relayOn && state.dc12Connected;
      const studioMode = state.studioFoco !== undefined || state.studioCooler !== undefined;
      const bulbOn = power12Active && (studioMode ? Boolean(state.studioFoco) : (state.load12Mode === 'bulb' || state.load12Mode === 'both'));
      const fanOn  = power12Active && (studioMode ? Boolean(state.studioCooler) : (state.load12Mode === 'fan'  || state.load12Mode === 'both'));

      bulbMat.emissiveIntensity = bulbOn ? 3.2 : 0.0;
      bulbLight.intensity = bulbOn ? 2.4 : 0.0;
      filamentMat.color.setHex(bulbOn ? 0xffffff : 0x9ca3af);

      const targetFanSpeed = fanOn ? 20.0 : 0.0;
      state.fanSpeed += (targetFanSpeed - state.fanSpeed) * 0.08;
      fanRotor.rotation.z -= state.fanSpeed * dt;

      if (state.viewMode === '3d') {
        renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
        scene.background = BG_DARK; scene.fog = FOG_DARK; desk.material = MATS.deskDark;
        wiresCurvedGroup.visible = true; wiresStraightGroup.visible = false;
        renderer.clear(); renderer.render(scene, perspCam);
        projectLabelSet(labelMapL, perspCam, W, H);
      } else if (state.viewMode === 'iso') {
        renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
        scene.background = BG_LIGHT; scene.fog = null; desk.material = MATS.deskLight;
        wiresCurvedGroup.visible = false; wiresStraightGroup.visible = true;
        renderer.clear(); renderer.render(scene, orthoCam);
        projectLabelSet(labelMapR, orthoCam, W, H);
      } else {
        const half = Math.floor(W / 2);
        renderer.setScissorTest(true);
        renderer.setViewport(0, 0, half, H); renderer.setScissor(0, 0, half, H);
        scene.background = BG_DARK; scene.fog = FOG_DARK; desk.material = MATS.deskDark;
        wiresCurvedGroup.visible = true; wiresStraightGroup.visible = false;
        renderer.clear(); renderer.render(scene, perspCam);
        projectLabelSet(labelMapL, perspCam, half, H);

        renderer.setViewport(half, 0, W - half, H); renderer.setScissor(half, 0, W - half, H);
        scene.background = BG_LIGHT; scene.fog = null; desk.material = MATS.deskLight;
        wiresCurvedGroup.visible = false; wiresStraightGroup.visible = true;
        renderer.clear(); renderer.render(scene, orthoCam);
        projectLabelSet(labelMapR, orthoCam, W - half, H);
      }
    }

    window.addEventListener('resize', handleResize);
    rebuildWires();
    goToStep(0);

    // Digital twin (?twin=1): a click on the relay, a 12V load or the buzzer goes to the Studio, which acts on the
    // real (or virtual) device: postMessage { type: 'studio-twin-click', part: 'relay'|'bulb'|'fan'|'buzzer' }.
    const TWIN_PARTS = [['relay', relayGroup], ['bulb', bulb12Group], ['fan', fan12Group], ['buzzer', buzzerGroup]];
    function twinPart(object) {
      for (let o = object; o; o = o.parent) {
        const found = TWIN_PARTS.find(([, group]) => group === o);
        if (found) return found[0];
      }
      return null;
    }

    // Studio bridge: the demo page sends the virtual ESP32 state with postMessage (same origin only).
    // Message: { type: 'studio-device', foco?, cooler?, alarma?, oledHeader?, oledLines? }
    function applyStudioMessage(e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'studio-device') return;
      const d = e.data;
      if ('foco' in d) state.studioFoco = d.foco;
      if ('cooler' in d) state.studioCooler = d.cooler;
      if ('foco' in d || 'cooler' in d) {
        state.relayOn = Boolean(state.studioFoco || state.studioCooler);
      }
      if (d.alarma) { state.buzzerOn = true; playBeep(); setTimeout(() => { state.buzzerOn = false; drawOledScreen(); }, 650); }
      if ('oledLines' in d) { state.oledHeader = d.oledHeader; state.oledLines = d.oledLines; }
      drawOledScreen(); updateLaptopScreen();
    }
    window.addEventListener('message', applyStudioMessage);
    if (twinMode || new URLSearchParams(location.search).has('embed')) {
      document.body.classList.add('studio-embed');
      const style = document.createElement('style');
      style.textContent = '.studio-embed .topbar, .studio-embed .steps-index, .studio-embed .tutor-dock { display: none !important; }';
      document.head.appendChild(style);
    }
    if (document.body.classList.contains('studio-embed')) goToStep(12);
    setViewMode('iso');
    animate();
  })();
  </script>
</body>
</html>
