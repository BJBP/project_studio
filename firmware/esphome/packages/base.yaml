# Base of every Studio ESP32-S3 (16 MB flash): name, chip, logs, Home Assistant API and OTA.
# The network comes from wifi.yaml (real board) or qemu_net.yaml (simulator).
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: project_studio.${name}
    version: "1.0"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
