# Voice: INMP441 microphone on I2S0 (WS 4, SCK 5, SD 6) and MAX98357A amplifier on I2S1 (LRC 15, BCLK 16, DIN 17).
# Wake word "Okay Nabu" runs on the ESP32 (microWakeWord, Apache 2.0); the voice pipeline runs in Home Assistant.
i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO16

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    i2s_din_pin: GPIO6
    adc_type: external
    channel: left
    bits_per_sample: 32bit

speaker:
  - platform: i2s_audio
    id: voice_speaker
    i2s_audio_id: i2s_speaker
    i2s_dout_pin: GPIO17
    dac_type: external
    channel: mono

micro_wake_word:
  microphone: mic
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: mic
  speaker: voice_speaker
  noise_suppression_level: 2
  auto_gain: 31dBFS
  on_listening:
    - text.set:
        id: oled_text
        value: "Escuchando..."
  on_stt_end:
    - text.set:
        id: oled_text
        value: !lambda "return x.substr(0, 64);"
  on_tts_start:
    - text.set:
        id: oled_text
        value: !lambda "return x.substr(0, 64);"
  on_end:
    - micro_wake_word.start:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

# Microphone level for the Studio's voice monitor: if this moves when you talk, the microphone and its wiring work.
# Passive: it only listens while the wake word (or the assistant) already has the microphone on.
sensor:
  - platform: sound_level
    passive: true
    measurement_duration: 500ms
    microphone:
      microphone: mic
      bits_per_sample: 16
    rms:
      name: "Nivel del micrófono"
