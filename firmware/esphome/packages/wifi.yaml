# Real board only. No Wi-Fi name in the firmware: the Studio sends it over the USB cable (serial_bridge «@wifi»).
# The same cable carries orders and states in cable mode, so the board works from the Studio without Wi-Fi too.
wifi:
  ap: {}

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [serial_bridge]

# Lines that start with "@" on the «COM» connector: see components/serial_bridge/serial_bridge.h.
serial_bridge:

# The bridge talks on the logger's port. The ESP32-S3 defaults to its native USB; UART0 is the «COM» connector
# (USB-to-serial chip), the one used to install.
logger:
  hardware_uart: UART0
